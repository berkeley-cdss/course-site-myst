name: Accessibility Checks

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
env:
  # `BASE_URL` determines, relative to the root of the domain, the URL that your site is served from.
  # E.g., if your site lives at `https://mydomain.org/myproject`, set `BASE_URL=/myproject`.
  # If, instead, your site lives at the root of the domain, at `https://mydomain.org`, set `BASE_URL=''`.
  BASE_URL: /${{ github.event.repository.name }}

jobs:
  axe-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4   
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - name: Install MyST Markdown, Axe CLI, and HTTP Server
        run: npm install -g mystmd  @axe-core/cli http-server wait-on
      - name: Install the plugins
        run: npm install
      - name: Build HTML Assets
        run: myst build --html
      - name: Get Matching Chrome version
        run: npx browser-driver-manager install chrome
      # Serve, Discover URLs, and Run Axe
      - name: Run Axe Checks
        run: |
          # A. Create a subdirectory structure that matches the BASE_URL
          mkdir -p staging${BASE_URL}
          cp -r _build/html/* staging${BASE_URL}/
          
          # B. Start a local server in the background
          npx http-server staging -p 8080 -s &
          npx wait-on http://localhost:8080${BASE_URL}/
          
          # C. Generate the URL list from the actual build artifacts
          cd _build/html
          URLS=$(find . -name "*.html" -not -path "*/build/*" | sed 's|^\./||' | sed "s|^|http://localhost:8080${BASE_URL}/|" | tr '\n' ' ')          
          
          # D. Run Axe CLI on the discovered URLs
          axe $URLS \
            --tags wcag2a,wcag2aa,wcag21a,wcag21aa \
            --save axe-report.json \
            --exit
      - name: Upload Accessibility Report
        if: always() 
        uses: actions/upload-artifact@v4
        with:
          name: axe-report
          path: _build/html/axe-report.json
      - name: Calculate and Push Badge
        if: always()
        run: |
          # 1. Calculate the score and create the JSON file
          node -e "
            const fs = require('fs');
            if (!fs.existsSync('_build/html/axe-report.json')) process.exit(0);
            const data = JSON.parse(fs.readFileSync('_build/html/axe-report.json', 'utf8'));
            
            let violationsCount = 0;
            let incompleteCount = 0;
            
            data.forEach(page => {
              if (page.violations) violationsCount += page.violations.reduce((sum, rule) => sum + rule.nodes.length, 0);
              if (page.incomplete) incompleteCount += page.incomplete.reduce((sum, rule) => sum + rule.nodes.length, 0);
            });
            
            let color = 'success';
            if (violationsCount > 0) color = 'red';
            else if (incompleteCount > 0) color = 'yellow';
            
            let msg = [];
            if (violationsCount > 0) msg.push(violationsCount + ' violations');
            if (incompleteCount > 0) msg.push(incompleteCount + ' issues');
            if (msg.length === 0) msg.push('passed');
            
            const badge = {
              schemaVersion: 1,
              label: 'a11y',
              message: msg.join(', '),
              color: color,
              cacheSeconds: 60
            };
            
            fs.writeFileSync('a11y-badge.json', JSON.stringify(badge, null, 2));
          "
          
          # 2. Push to the orphaned 'badges' branch using Force Push
          if [ -f a11y-badge.json ]; then
            mkdir badge-repo && cd badge-repo
            git init
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git checkout -b badges
            
            mv ../a11y-badge.json .
            git add a11y-badge.json
            git commit -m "Update a11y badge score"
            
            git push --force "https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" badges
          fi
